name: Tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    uses: bitcart/bitcart-actions/.github/workflows/lint.yml@master

  workflows:
    name: workflows
    uses: bitcart/bitcart-actions/.github/workflows/workflow-checks.yml@master

    permissions:
      contents: read
      security-events: write # needed for github advanced security

  test:
    name: test
    uses: bitcart/bitcart-actions/.github/workflows/python-tests.yml@master
    needs: [lint, workflows]

    permissions:
      contents: read
      id-token: write # OIDC token for codecov uploads

  agent:
    name: agent-${{ matrix.os }}
    needs: [lint, workflows]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: bitcart/bitcart-actions/actions/setup-go@master
        with:
          enable-cache: "false"

      - name: Run host agent tests
        working-directory: host-agent
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: "v1.9.0"
        run: |
          go vet ./...
          go test -race ./...
          go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  cansetup:
    name: cansetup
    needs: [test, agent]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test installation
        run: |
          sudo .github/test-install.sh
